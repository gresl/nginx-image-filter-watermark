name: Check optimized image-filter output

on:
  push:
    branches:
      - 'optimization/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: nginx ${{ matrix.nginx }} parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        nginx: ['1.30.2', '1.30.5']

    steps:
      - name: Checkout source and original hardening commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate local benchmarking script syntax
        run: python3 -m py_compile tools/benchmark_local.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libgd-dev libpcre2-dev zlib1g-dev imagemagick

      - name: Compile stable baseline and candidate against same nginx
        shell: bash
        env:
          VERSION: ${{ matrix.nginx }}
        run: |
          set -euo pipefail
          curl -fsSLO "https://nginx.org/download/nginx-$VERSION.tar.gz"
          tar -xzf "nginx-$VERSION.tar.gz"
          mkdir baseline candidate
          cp -a "nginx-$VERSION" "baseline/nginx-$VERSION"
          mv "nginx-$VERSION" "candidate/nginx-$VERSION"

          git show ef879803c1d0405e87f7a59b9598bd3e49c2bf9b:ngx_http_image_filter_module.c \
            > "baseline/nginx-$VERSION/src/http/modules/ngx_http_image_filter_module.c"
          cp ngx_http_image_filter_module.c \
            "candidate/nginx-$VERSION/src/http/modules/ngx_http_image_filter_module.c"

          for variant in baseline candidate; do
            (
              cd "$variant/nginx-$VERSION"
              ./configure --with-http_image_filter_module --with-debug
              make -j2
              ./objs/nginx -V
            )
          done

      - name: Confirm output compatibility (real HTTP requests)
        shell: bash
        env:
          VERSION: ${{ matrix.nginx }}
        run: |
          bash tests/compare_outputs.sh \
            "$PWD/baseline/nginx-$VERSION" \
            "$PWD/candidate/nginx-$VERSION"

      - name: Smoke-test local ABBA benchmark and nginx restarts
        if: matrix.nginx == '1.30.5'
        shell: bash
        run: bash tests/smoke_benchmark_local.sh "$PWD"

      - name: Verify JPEG-watermark matrix and oversize skip behavior
        if: matrix.nginx == '1.30.5'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/verify_jpeg_matrix.py
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          convert -size 1080x720 gradient:'#223344-#cdb897' -quality 88 "$tmp/landscape.jpg"
          convert -size 1080x810 plasma:fractal -quality 85 "$tmp/portraitish.jpg"
          convert -size 300x106 xc:'#34475c' "$tmp/opaque.png"
          convert -size 280x300 xc:none -fill 'rgba(80,20,90,0.6)' \
            -draw 'rectangle 10,20 240,280' "$tmp/alpha.png"

          sudo python3 tools/verify_jpeg_matrix.py \
            --first-binary "$PWD/baseline/nginx-1.30.5/objs/nginx" \
            --second-binary "$PWD/candidate/nginx-1.30.5/objs/nginx" \
            --jpeg "$tmp/landscape.jpg" \
            --jpeg "$tmp/portraitish.jpg" \
            --watermark "$tmp/opaque.png" \
            --watermark "$tmp/alpha.png" \
            --port 18765 \
            --report "$tmp/matrix.csv"

      - name: Validate bounded multiworker concurrency test
        if: matrix.nginx == '1.30.5'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/test_concurrency.py
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          convert -size 1080x720 plasma:fractal -quality 85 "$tmp/photo.jpg"
          convert -size 300x150 xc:none -fill 'rgba(10,50,90,0.5)' \
            -draw 'rectangle 10,10 280,140' "$tmp/watermark.png"
          sudo python3 tools/test_concurrency.py \
            --first-binary "$PWD/baseline/nginx-1.30.5/objs/nginx" \
            --second-binary "$PWD/candidate/nginx-1.30.5/objs/nginx" \
            --source-jpeg "$tmp/photo.jpg" \
            --watermark-png "$tmp/watermark.png" \
            --port 18766 \
            --workers 4 \
            --concurrency 8 \
            --requests-per-case 20 \
            --report "$tmp/concurrency.csv"
